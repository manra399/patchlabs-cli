[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchlabs-cli"
version = "0.1.0"
description = "Static checks for apps built with Lovable, Supabase, Bolt, Replit or Cursor: code, dependencies, SQL row level security and live site headers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "PatchLabs" }]
keywords = ["security", "supabase", "lovable", "row level security", "sarif", "static analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://patchlabs.dev"
Repository = "https://github.com/manra399/patchlabs-cli"
Methodology = "https://patchlabs.dev/research"

[project.scripts]
patchlabs = "patchlabs_cli.cli:main"

[tool.setuptools.packages.find]
include = ["patchlabs_cli*"]
